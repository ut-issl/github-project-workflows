name: Auto Label TAG (Reusable)

on:
  workflow_call:

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply TAG labels based on repository topics
        uses: actions/github-script@v9
        with:
          script: |
            // Mapping from topic name to tag:: label
            const TOPIC_TO_LABEL = {
              "autonomy-tag": "tag::autonomy",
              "formal-methods-tag": "tag::formal-methods",
              "inference-tag": "tag::inference",
            };

            // Get repository topics
            const { data: repoData } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const topics = repoData.topics || [];

            if (topics.length === 0) {
              core.info("No topics found on this repository. Skipping.");
              return;
            }

            // Resolve labels from topics
            const labelsToApply = new Set();
            for (const topic of topics) {
              if (TOPIC_TO_LABEL[topic]) {
                labelsToApply.add(TOPIC_TO_LABEL[topic]);
              }
            }

            if (labelsToApply.size === 0) {
              core.info(
                `Topics [${topics.join(", ")}] did not match any TAG. Skipping.`
              );
              return;
            }

            // Get the issue or PR number
            const number =
              context.payload.issue?.number ||
              context.payload.pull_request?.number;
            if (!number) {
              core.warning("No issue or PR number found in event payload");
              return;
            }

            const labels = [...labelsToApply];
            core.info(`Applying labels: ${labels.join(", ")}`);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels,
            });
