name: Update Renovate PR Tracking (Reusable)

on:
  workflow_call:
    inputs:
      project-number:
        description: "The GitHub Project number to update"
        required: true
        type: string
      tracking-field-name:
        description: "The name of the tracking field in the project"
        required: false
        type: string
        default: "Tracking"
      dry-run:
        description: "If true, only log changes without applying them"
        required: false
        type: boolean
        default: false
    secrets:
      ITERATION_AUTOMATION_APP_ID:
        required: true
      ITERATION_AUTOMATION_APP_PRIVATE_KEY:
        required: true

jobs:
  update-renovate-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ITERATION_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ITERATION_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Update tracking for Renovate PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          TRACKING_FIELD: ${{ inputs.tracking-field-name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          echo "Fetching project #${PROJECT_NUMBER} from ${ORG}..."

          # ── Step 1: Get project metadata (field IDs, option IDs) ──
          # shellcheck disable=SC2016
          META=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  title
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }
          ' -f org="$ORG" -F number="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$META" | jq -r '.data.organization.projectV2.id')
          PROJECT_TITLE=$(echo "$META" | jq -r '.data.organization.projectV2.title')

          if [ "$PROJECT_ID" = "null" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Project #${PROJECT_NUMBER} not found in ${ORG}"
            exit 1
          fi

          extract_option_id() {
            echo "$META" | jq -r \
              ".data.organization.projectV2.fields.nodes[]
               | select(.name == \"$1\")
               | .options[]
               | select(.name == \"$2\")
               | .id"
          }

          TRACKING_FIELD_ID=$(echo "$META" | jq -r \
            ".data.organization.projectV2.fields.nodes[] | select(.name == \"$TRACKING_FIELD\") | .id")
          CLOSED_OPT=$(extract_option_id "$TRACKING_FIELD" "Closed")

          if [ -z "$TRACKING_FIELD_ID" ]; then
            echo "::error::Field '${TRACKING_FIELD}' not found in project '${PROJECT_TITLE}'"
            exit 1
          fi
          if [ -z "$CLOSED_OPT" ]; then
            echo "::error::Required option 'Closed' not found in field '${TRACKING_FIELD}'"
            exit 1
          fi

          echo "Project: \"${PROJECT_TITLE}\" (${PROJECT_ID})"
          echo "Tracking field: ${TRACKING_FIELD_ID}, Closed=${CLOSED_OPT}"

          # ── Step 2: Fetch all Renovate PRs from the project ──
          # shellcheck disable=SC2016
          ITEMS_QUERY='
            query($org: String!, $number: Int!, $cursor: String) {
              organization(login: $org) {
                projectV2(number: $number) {
                  items(first: 100, after: $cursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id
                      content {
                        __typename
                        ... on PullRequest {
                          author { login }
                          number
                          title
                          repository { nameWithOwner }
                        }
                      }
                      fieldValues(first: 20) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field { ... on ProjectV2SingleSelectField { name } }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          '

          # shellcheck disable=SC2016
          JQ_FILTER='
            [.data.organization.projectV2.items.nodes[] |
             select(.content.__typename == "PullRequest") |
             # Match every Renovate bot by its "renovate" login prefix. This covers
             # the hosted app (GraphQL "renovate" / REST "renovate[bot]") and any
             # self-hosted instances such as "renovate-ut-issl-self-hosted", whose
             # logins likewise start with "renovate". No human account in the org
             # uses such a login, so a prefix match is safe.
             select((.content.author.login // "") | startswith("renovate")) |
             {
               id,
               pr: "\(.content.repository.nameWithOwner)#\(.content.number)",
               title: .content.title,
               tracking: [.fieldValues.nodes[] | select(.field.name? == $tf) | .name][0]
             }]
          '

          RENOVATE_ITEMS="[]"
          CURSOR=""

          while true; do
            if [ -z "$CURSOR" ]; then
              RESULT=$(gh api graphql -f query="$ITEMS_QUERY" -f org="$ORG" -F number="$PROJECT_NUMBER")
            else
              RESULT=$(gh api graphql \
                -f query="$ITEMS_QUERY" \
                -f org="$ORG" \
                -F number="$PROJECT_NUMBER" \
                -f cursor="$CURSOR")
            fi

            PAGE_ITEMS=$(echo "$RESULT" | jq -c --arg tf "$TRACKING_FIELD" "$JQ_FILTER")
            RENOVATE_ITEMS=$(echo "$RENOVATE_ITEMS" "$PAGE_ITEMS" | jq -s '.[0] + .[1]')

            HAS_NEXT=$(echo "$RESULT" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
            if [ "$HAS_NEXT" != "true" ]; then break; fi
            CURSOR=$(echo "$RESULT" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
          done

          TOTAL=$(echo "$RENOVATE_ITEMS" | jq 'length')
          echo ""
          echo "Found ${TOTAL} Renovate PR(s) in project."

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          # ── Step 3: Apply tracking updates ──
          update_tracking() {
            # shellcheck disable=SC2016
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" \
              -f itemId="$1" \
              -f fieldId="$TRACKING_FIELD_ID" \
              -f optionId="$2" > /dev/null
          }

          SUCCESS=0
          SKIP=0
          FAIL=0

          while IFS= read -r item; do
            [ -z "$item" ] && continue

            ITEM_ID=$(echo "$item" | jq -r '.id')
            PR=$(echo "$item" | jq -r '.pr')
            TITLE=$(echo "$item" | jq -r '.title')
            TRACKING=$(echo "$item" | jq -r '.tracking // "none"')

            # Renovate PRs never need discussion or manual tracking on the board,
            # so every Renovate item is forced to Closed regardless of PR state or
            # project Status. Items already Closed are skipped.
            if [ "$TRACKING" = "Closed" ]; then
              SKIP=$((SKIP + 1))
              continue
            fi

            echo "${PR}: ${TITLE}"
            echo "  Tracking=${TRACKING} → Closed"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  [DRY RUN]"
              SUCCESS=$((SUCCESS + 1))
            elif update_tracking "$ITEM_ID" "$CLOSED_OPT"; then
              echo "  [OK]"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  [FAIL]"
              FAIL=$((FAIL + 1))
            fi
          done <<< "$(echo "$RENOVATE_ITEMS" | jq -c '.[]')"

          echo ""
          echo "Done. Updated: ${SUCCESS}, Skipped: ${SKIP}, Failed: ${FAIL}, Total: ${TOTAL}"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::${FAIL} update(s) failed."
            exit 1
          fi
