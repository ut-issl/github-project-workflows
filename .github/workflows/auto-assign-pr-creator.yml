name: Auto Assign PR Creator (Reusable)

on:
  workflow_call:

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR creator as assignee
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.warning("No pull_request found in event payload");
              return;
            }

            const creator = pr.user.login;
            const creatorType = pr.user.type;

            if (creatorType !== "User") {
              core.info(`${creator} is a ${creatorType}, not a User. Skipping.`);
              return;
            }

            const currentAssignees = pr.assignees.map((a) => a.login);

            if (currentAssignees.includes(creator)) {
              core.info(`${creator} is already assigned. Skipping.`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [creator],
            });

            core.info(`Assigned ${creator} to PR #${pr.number}`);
